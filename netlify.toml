[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # Do NOT set NODE_ENV=production here — Netlify's `npm install` would skip
  # devDependencies (typescript, etc.) and break next build.
  # NODE_ENV is set only for the build script in package.json.
